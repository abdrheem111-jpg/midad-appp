name: Khalfoun

on:
  push:
    paths:
      - 'khalfoun/**'
      - '.github/workflows/khalfoun.yml'
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: khalfoun
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: khalfoun/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Real app smoke test
        run: npm run smoke
      - name: Real Windows checks (windows, apps, volume, typing)
        if: runner.os == 'Windows'
        run: npm run check:windows
      - name: Browser UI scenarios
        if: runner.os == 'Linux'
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node tools/ui-check.mjs ui-shots
      - name: Upload UI screenshots
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: khalfoun-ui-screenshots
          path: khalfoun/ui-shots
          if-no-files-found: ignore

  installer:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: khalfoun
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: khalfoun/package-lock.json
      - run: npm ci
      - name: Build installer
        run: npm run dist:win
      - name: Self-test the packaged app
        env:
          KHALFOUN_APP_EXE: ${{ github.workspace }}\khalfoun\dist\win-unpacked\Khalfoun.exe
        run: npm run smoke
      - name: Install silently, then self-test the installed app
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          # The installer can return before every file is in place: wait for the program to appear.
          $roots = @((Join-Path $env:LOCALAPPDATA 'Programs'), $env:ProgramFiles, ${env:ProgramFiles(x86)}) | Where-Object { $_ -and (Test-Path $_) }
          $installed = $null
          for ($i = 0; $i -lt 60 -and -not $installed; $i++) {
            foreach ($root in $roots) {
              $hit = Get-ChildItem $root -Recurse -Filter Khalfoun.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch 'Uninstall' } | Select-Object -First 1
              if ($hit) { $installed = $hit.FullName; break }
            }
            if (-not $installed) { Start-Sleep -Seconds 1 }
          }
          if (-not $installed) { Write-Error 'Khalfoun.exe was not installed'; exit 1 }
          Write-Host "Installed at $installed"
          $env:KHALFOUN_APP_EXE = $installed
          npm run smoke
