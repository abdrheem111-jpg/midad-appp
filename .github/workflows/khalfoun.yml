name: Khalfoun

on:
  push:
    paths:
      - 'khalfoun/**'
      - '.github/workflows/khalfoun.yml'
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: khalfoun
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: khalfoun/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Real app smoke test
        run: npm run smoke
      - name: Real Windows checks (windows, apps, volume, typing)
        if: runner.os == 'Windows'
        run: npm run check:windows
      - name: Browser UI scenarios
        if: runner.os == 'Linux'
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node tools/ui-check.mjs ui-shots
      - name: Upload UI screenshots
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: khalfoun-ui-screenshots
          path: khalfoun/ui-shots
          if-no-files-found: ignore

  installer:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: khalfoun
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: khalfoun/package-lock.json
      - run: npm ci
      - name: Build installer
        run: npm run dist:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Khalfoun-Windows-Installer
          path: khalfoun/dist/*.exe
          if-no-files-found: error
      - name: Self-test the packaged app
        env:
          KHALFOUN_APP_EXE: ${{ github.workspace }}\khalfoun\dist\win-unpacked\Khalfoun.exe
        run: npm run smoke
      - name: Install silently, then self-test the installed app
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*.exe | Select-Object -First 1
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\Khalfoun\Khalfoun.exe'),
            (Join-Path $env:LOCALAPPDATA 'Programs\khalfoun\Khalfoun.exe'),
            (Join-Path $env:ProgramFiles 'Khalfoun\Khalfoun.exe')
          )
          $installed = $null
          # Up to two attempts: a copy of the app left over from the previous self-test makes
          # the installer stop silently, so close any running copy before each attempt.
          for ($attempt = 1; $attempt -le 2 -and -not $installed; $attempt++) {
            Get-Process -Name 'Khalfoun' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            $timer = [Diagnostics.Stopwatch]::StartNew()
            $proc = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
            Write-Host "attempt $attempt : installer exit code $($proc.ExitCode) after $([int]$timer.Elapsed.TotalSeconds)s"
            for ($i = 0; $i -lt 60 -and -not $installed; $i++) {
              $installed = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
              if (-not $installed) { Start-Sleep -Seconds 1 }
            }
          }
          if (-not $installed) {
            Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "found folder: $($_.FullName)" }
            Get-Process | Where-Object { $_.ProcessName -match 'khalfoun' } | ForEach-Object { Write-Host "running: $($_.ProcessName) $($_.Id)" }
            Write-Error 'Khalfoun.exe was not installed'; exit 1
          }
          Write-Host "Installed at $installed"
          $env:KHALFOUN_APP_EXE = $installed
          npm run smoke
