<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<title>مايك خلفون</title>
<style>
  :root { --bg: #f6f1e6; --ink: #2a1a10; --accent: #1f6f5c; --red: #c0392b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, "Segoe UI", Tahoma, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); user-select: none; -webkit-user-select: none; }
  h1 { font-size: 22px; margin: 6px 0 2px; }
  #state { font-size: 15px; padding: 6px 14px; border-radius: 999px; background: #e7dfcf; }
  #state.ok { background: #d5efe5; color: var(--accent); }
  #state.bad { background: #f6d9d5; color: var(--red); }
  #talk { width: min(70vw, 300px); aspect-ratio: 1; border-radius: 50%; border: none; background: var(--accent); color: #fff; font-size: 26px; font-weight: 700; box-shadow: 0 10px 30px rgba(31,111,92,.35); touch-action: none; transition: transform .08s; }
  #talk.on { background: var(--red); transform: scale(.96); box-shadow: 0 0 0 calc(10px + var(--lv, 0) * 30px) rgba(192,57,43,.25); }
  #talk:disabled { opacity: .5; }
  .row { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .toggle { display: flex; align-items: center; gap: 10px; font-size: 18px; background: #fff; padding: 12px 16px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .toggle input { width: 26px; height: 26px; accent-color: var(--accent); }
  #start { font-size: 20px; padding: 14px 28px; border-radius: 14px; border: none; background: var(--accent); color: #fff; font-weight: 700; }
  p.fine { font-size: 14px; color: #6b5a4c; text-align: center; margin: 4px 8px; line-height: 1.6; }
  #meter { width: min(80vw, 320px); height: 8px; border-radius: 4px; background: #e7dfcf; overflow: hidden; }
  #meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .1s; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="row" style="flex-direction:column">
    <h1>🎙️ مايك خلفون</h1>
    <span id="state">جاري الاتصال…</span>
  </div>

  <div id="intro" class="row" style="flex-direction:column">
    <p class="fine">التلفون بيصير مايك لخلفون. اضغط «ابدأ» واسمح بالمايك.</p>
    <button id="start" type="button">ابدأ</button>
  </div>

  <div id="main" class="row" style="flex-direction:column" hidden>
    <button id="talk" type="button" aria-label="اضغط وتكلم">اضغط<br>وتكلم</button>
    <div id="meter"><i></i></div>
    <label class="toggle"><input id="always" type="checkbox" checked> استماع دائم («يا خلفون»)</label>
    <p class="fine" id="hint">خلّ الصفحة مفتوحة والشاشة شغالة. نادِ «يا خلفون» أو اضغط الزر وتكلم.</p>
  </div>

  <p class="fine">الصوت يروح لجهاز خلفون في نفس الشبكة بس.</p>

<script>
'use strict';
const KEY = new URLSearchParams(location.search).get('k') || '';
const $ = (id) => document.getElementById(id);
const RATE = 16000;
let ctx = null; let stream = null; let node = null; let src = null;
let pending = []; let pendingLen = 0; let seq = 0; let sending = false;
let talking = false; let talkBuf = []; let talkLen = 0;
let lock = null; let failures = 0; let lastOk = 0;

function setState(text, cls) { const s = $('state'); s.textContent = text; s.className = cls || ''; }
async function post(path, body, type) {
  const r = await fetch(`${path}?k=${encodeURIComponent(KEY)}${path === '/audio' ? `&seq=${seq++}` : ''}`, { method: 'POST', body, headers: type ? { 'content-type': type } : {}, cache: 'no-store' });
  if (!r.ok && r.status !== 204) throw new Error(`http ${r.status}`);
  return r;
}
async function hello() {
  try { await post('/hello', ''); lastOk = Date.now(); failures = 0; setState(talking ? '🔴 أسمعك…' : ($('always').checked ? '✓ متصل بخلفون: أسمع ندائك' : '✓ متصل بخلفون'), 'ok'); }
  catch { failures += 1; if (failures > 1) setState('✗ ما وصلت لخلفون. تأكد إن الجهازين على نفس الشبكة', 'bad'); }
}

/** Same as Khalfoun's own downsample (box average), so his ear hears the same thing. */
function downsample(input, from, to) {
  if (from === to) return input;
  const ratio = from / to; const out = new Float32Array(Math.floor(input.length / ratio));
  for (let i = 0; i < out.length; i += 1) { const s = Math.floor(i * ratio); const e = Math.min(input.length, Math.floor((i + 1) * ratio)); let sum = 0; for (let j = s; j < e; j += 1) sum += input[j]; out[i] = sum / Math.max(1, e - s); }
  return out;
}
function toPcm16(f) { const out = new Int16Array(f.length); for (let i = 0; i < f.length; i += 1) out[i] = Math.max(-1, Math.min(1, f[i])) * 32767; return out; }
function wav16(f) {
  const pcm = toPcm16(f); const buf = new ArrayBuffer(44 + pcm.length * 2); const v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i += 1) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + pcm.length * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, RATE, true); v.setUint32(28, RATE * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, pcm.length * 2, true);
  new Int16Array(buf, 44).set(pcm); return new Uint8Array(buf);
}

async function flush() {
  if (sending || !pendingLen) return;
  sending = true;
  const all = new Float32Array(pendingLen); let o = 0;
  for (const c of pending) { all.set(c, o); o += c.length; }
  pending = []; pendingLen = 0;
  try { await post('/audio', toPcm16(all).buffer, 'application/octet-stream'); lastOk = Date.now(); failures = 0; }
  catch { failures += 1; if (failures > 3) setState('✗ انقطع الاتصال بخلفون…', 'bad'); }
  sending = false;
}

function onSound(f) {
  let peak = 0; for (let i = 0; i < f.length; i += 1) peak = Math.max(peak, Math.abs(f[i]));
  $('meter').firstElementChild.style.width = `${Math.min(100, peak * 140)}%`;
  $('talk').style.setProperty('--lv', String(Math.min(1, peak * 2)));
  const s = downsample(f, ctx.sampleRate, RATE);
  if (talking) { talkBuf.push(s); talkLen += s.length; if (talkLen > RATE * 40) endTalk(); return; }
  if (!$('always').checked) return;
  pending.push(s); pendingLen += s.length;
  if (pendingLen > RATE * 2) { pending = pending.slice(-4); pendingLen = pending.reduce((n, c) => n + c.length, 0); } // fell behind
  if (pendingLen >= RATE * 0.2) flush();
}

async function start() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
  } catch (err) {
    setState(location.protocol !== 'https:' ? '✗ لازم الصفحة تنفتح من رمز QR' : '✗ ما سمحت بالمايك. اسمح له من إعدادات المتصفح', 'bad');
    return;
  }
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();
  src = ctx.createMediaStreamSource(stream);
  node = ctx.createScriptProcessor(4096, 1, 1);
  node.onaudioprocess = (e) => onSound(new Float32Array(e.inputBuffer.getChannelData(0)));
  src.connect(node); node.connect(ctx.destination);
  $('intro').hidden = true; $('main').hidden = false;
  keepAwake();
  hello();
  setInterval(hello, 2500);
}

async function keepAwake() {
  try { lock = await navigator.wakeLock?.request('screen'); } catch { lock = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); ctx?.resume(); } });

function beginTalk(e) {
  e.preventDefault();
  if (!ctx || talking) return;
  talking = true; talkBuf = []; talkLen = 0;
  $('talk').classList.add('on');
  navigator.vibrate?.(30);
  setState('🔴 أسمعك… اترك الزر لما تخلص', 'ok');
}
async function endTalk() {
  if (!talking) return;
  talking = false;
  $('talk').classList.remove('on');
  const all = new Float32Array(talkLen); let o = 0;
  for (const c of talkBuf) { all.set(c, o); o += c.length; }
  talkBuf = []; talkLen = 0;
  if (all.length < RATE * 0.3) { setState('اضغط الزر وخلك ضاغط وأنت تتكلم', 'ok'); return; }
  setState('… أرسلت لخلفون', 'ok');
  try { await post('/say', wav16(all), 'audio/wav'); } catch { setState('✗ ما وصل الأمر لخلفون', 'bad'); }
}

$('start').addEventListener('click', start);
const t = $('talk');
t.addEventListener('pointerdown', beginTalk);
t.addEventListener('pointerup', endTalk);
t.addEventListener('pointercancel', endTalk);
t.addEventListener('pointerleave', endTalk);
t.addEventListener('contextmenu', (e) => e.preventDefault());
$('always').addEventListener('change', () => { hello(); if (!$('always').checked) { pending = []; pendingLen = 0; } });
window.addEventListener('pagehide', () => { try { navigator.sendBeacon(`/bye?k=${encodeURIComponent(KEY)}`); } catch { /* closing */ } });
hello();
</script>
</body>
</html>
