<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<title>مايك خلفون</title>
<style>
  :root { --bg: #f6f1e6; --ink: #2a1a10; --accent: #1f6f5c; --red: #c0392b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, "Segoe UI", Tahoma, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); user-select: none; -webkit-user-select: none; }
  h1 { font-size: 22px; margin: 6px 0 2px; }
  #state { font-size: 15px; padding: 6px 14px; border-radius: 999px; background: #e7dfcf; }
  #state.ok { background: #d5efe5; color: var(--accent); }
  #state.bad { background: #f6d9d5; color: var(--red); }
  #talk { width: min(70vw, 300px); aspect-ratio: 1; border-radius: 50%; border: none; background: var(--accent); color: #fff; font-size: 26px; font-weight: 700; box-shadow: 0 10px 30px rgba(31,111,92,.35); touch-action: none; transition: transform .08s; }
  #talk.on { background: var(--red); transform: scale(.96); box-shadow: 0 0 0 calc(10px + var(--lv, 0) * 30px) rgba(192,57,43,.25); }
  #talk:disabled { opacity: .5; }
  .row { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .toggle { display: flex; align-items: center; gap: 10px; font-size: 18px; background: #fff; padding: 12px 16px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .toggle input { width: 26px; height: 26px; accent-color: var(--accent); }
  #start { font-size: 20px; padding: 14px 28px; border-radius: 14px; border: none; background: var(--accent); color: #fff; font-weight: 700; }
  p.fine { font-size: 14px; color: #6b5a4c; text-align: center; margin: 4px 8px; line-height: 1.6; }
  #meter { width: min(80vw, 320px); height: 8px; border-radius: 4px; background: #e7dfcf; overflow: hidden; }
  #meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .1s; }
  .tabs { display: flex; gap: 6px; background: #e7dfcf; padding: 4px; border-radius: 14px; width: min(94vw, 460px); }
  .tabs button { flex: 1; border: none; background: transparent; font: inherit; font-size: 16px; padding: 10px 4px; border-radius: 10px; color: var(--ink); }
  .tabs button[aria-selected="true"] { background: #fff; font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .pane { width: min(94vw, 460px); display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
  .grid button, .wide { font: inherit; font-size: 17px; padding: 16px 8px; border-radius: 14px; border: none; background: #fff; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.07); }
  .grid button.on { background: #d5efe5; color: var(--accent); font-weight: 700; }
  #inbox .card { background: #fffbe6; border-radius: 14px; padding: 12px; margin: 8px 0; text-align: start; }
  #inbox .card p { white-space: pre-wrap; margin: 6px 0; font-size: 15px; }
  #inbox .row { display: flex; gap: 8px; flex-wrap: wrap; }
  #inbox .row button { flex: 1; padding: 10px; border-radius: 10px; border: none; background: #eef3f8; font: inherit; }
  #inbox .row button.go { background: var(--accent); color: #fff; }
  .grid button.danger { background: #b3261e; color: #fff; grid-column: 1 / -1; }
  .grid button.danger.on { background: #1e8449; }
  .grid button.big { font-size: 20px; padding: 22px 8px; background: var(--accent); color: #fff; }
  .wide { width: 100%; }
  .whisper { display: flex; gap: 8px; width: 100%; }
  .whisper input { flex: 1; font: inherit; font-size: 17px; padding: 12px; border-radius: 12px; border: 1px solid #d9cfbd; }
  .whisper button { font: inherit; padding: 0 16px; border-radius: 12px; border: none; background: var(--accent); color: #fff; }
  #stepinfo { font-size: 15px; color: #6b5a4c; min-height: 20px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="row" style="flex-direction:column">
    <h1>🎙️ مايك خلفون</h1>
    <span id="state">جاري الاتصال…</span>
  </div>

  <div id="intro" class="row" style="flex-direction:column">
    <p class="fine">التلفون بيصير مايك لخلفون. اضغط «ابدأ» واسمح بالمايك.</p>
    <button id="start" type="button">ابدأ</button>
  </div>

  <div id="main" class="pane" hidden>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="mic" aria-selected="true">🎙️ المايك</button>
      <button role="tab" data-tab="ctl" aria-selected="false">🎛️ التحكم</button>
      <button role="tab" data-tab="cam" aria-selected="false">📷 الكاميرا</button>
    </div>
    <div class="pane" data-pane="mic">
      <button id="talk" type="button" aria-label="اضغط وتكلم">اضغط<br>وتكلم</button>
      <div id="meter"><i></i></div>
      <label class="toggle"><input id="always" type="checkbox" checked> استماع دائم («يا خلفون»)</label>
      <p class="fine" id="hint">خلّ الصفحة مفتوحة والشاشة شغالة. نادِ «يا خلفون» أو اضغط الزر وتكلم.</p>
    </div>
    <div class="pane" data-pane="ctl" hidden>
      <section id="inbox" hidden><h3>📥 لك أنت بس <small id="inbox-n"></small></h3><div id="inbox-list"></div></section>
      <div class="grid">
        <button class="big" data-cmd="step_back">◀ الخطوة السابقة</button>
        <button class="big" data-cmd="step_next">الخطوة الجاية ▶</button>
      </div>
      <p id="stepinfo"></p>
      <div class="grid">
        <button data-cmd="mute" id="b-mute">🔇 سكّت صوته</button>
        <button data-cmd="bubble" id="b-bubble">💬 خبّي الفقاعة</button>
        <button data-cmd="random_student">🎲 طالب عشوائي</button>
        <button data-cmd="clear">🧽 امسح الشاشة</button>
        <button data-cmd="timer_1">⏱️ مؤقت ١ د</button>
        <button data-cmd="timer_3">⏱️ مؤقت ٣ د</button>
        <button data-cmd="timer_5">⏱️ مؤقت ٥ د</button>
        <button data-cmd="stop">✋ وقّف</button>
        <button data-cmd="celebrate">🎉 احتفال</button>
        <button data-cmd="fireworks">🎆 ألعاب نارية</button>
        <button data-cmd="undo">↶ تراجع عن آخر شي</button>
        <button data-cmd="fx" id="b-fx">✨ وقّف المؤثرات</button>
        <button data-cmd="hide">🙈 خبّي خلفون</button>
        <button data-cmd="emergency" id="b-emergency" class="danger">⛔ طوارئ: وقّف كل شي</button>
      </div>
      <form class="whisper" id="whisper">
        <input id="wtext" maxlength="300" placeholder="✍️ همسة لخلفون (ما تنقرأ بصوت)" autocomplete="off">
        <button type="submit">أرسل</button>
      </form>
    </div>
    <div class="pane" data-pane="cam" hidden>
      <button class="wide" data-photo="pick">🎯 اختار طالب بالكاميرا<br><small>صوّر الصف، وخلفون يختار واحد</small></button>
      <button class="wide" data-photo="doc">📖 اعرض الدفتر على الشاشة<br><small>صوّر حل الطالب ويطلع كبير قدام الكل</small></button>
      <button class="wide" data-photo="grade">📝 صحّح ورقة<br><small>صوّر الورقة وخلفون يصحّحها</small></button>
      <button class="wide" data-photo="key">📋 نموذج الإجابة<br><small>صوّره مرة قبل التصحيح</small></button>
      <button class="wide" data-photo="lesson">📘 حضّر درس من هالصفحة<br><small>أهداف وخطوات وأسئلة متدرجة وبطاقة خروج (ملف Word)</small></button>
      <button class="wide" data-photo="problem">🧮 مسألة من الكتاب<br><small>خلفون يحلها خطوة خطوة قدام الصف</small></button>
      <p class="fine" id="camstate">الصور تروح لجهاز خلفون بس، واختيار الطالب يصير على الجهاز نفسه.</p>
      <input id="shot" type="file" accept="image/*" capture="environment" hidden>
    </div>
  </div>

  <p class="fine">الصوت يروح لجهاز خلفون في نفس الشبكة بس.</p>

<script>
'use strict';
// The pairing key comes once in the QR address; it is kept for this tab only and removed from
// the address bar. Every request is signed with it (HMAC-SHA256) instead of carrying it.
const KEY = (() => {
  const k = new URLSearchParams(location.search).get('k');
  if (k) { try { sessionStorage.setItem('kh-k', k); } catch { /* private mode */ } history.replaceState(null, '', location.pathname); return k; }
  try { return sessionStorage.getItem('kh-k') || ''; } catch { return ''; }
})();
let hmacKey = null;
async function sign(method, path, query, ts) {
  hmacKey ??= await crypto.subtle.importKey('raw', new TextEncoder().encode(KEY), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const q = new URLSearchParams(query); q.delete('k'); q.sort();
  const mac = await crypto.subtle.sign('HMAC', hmacKey, new TextEncoder().encode(`${method} ${path}?${q} ${ts}`));
  return btoa(String.fromCharCode(...new Uint8Array(mac))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
const $ = (id) => document.getElementById(id);
const RATE = 16000;
let ctx = null; let stream = null; let node = null; let src = null;
let pending = []; let pendingLen = 0; let seq = 0; let sending = false;
let talking = false; let talkBuf = []; let talkLen = 0;
let lock = null; let failures = 0; let lastOk = 0;

function setState(text, cls) { const s = $('state'); s.textContent = text; s.className = cls || ''; }
async function post(path, body, type, extra = '') {
  const query = `${path === '/audio' ? `seq=${seq++}` : ''}${extra}`.replace(/^&/, '');
  const ts = Date.now();
  const headers = { 'x-kh-ts': String(ts), 'x-kh-sig': await sign('POST', path, query, ts) };
  if (type) headers['content-type'] = type;
  const r = await fetch(`${path}${query ? `?${query}` : ''}`, { method: 'POST', body, headers, cache: 'no-store' });
  if (!r.ok && r.status !== 204) throw new Error(`http ${r.status}`);
  return r;
}
async function hello() {
  try { const r = await post('/hello', ''); try { showState((await r.json()).state); } catch { /* old Khalfoun */ } lastOk = Date.now(); failures = 0; setState(talking ? '🔴 أسمعك…' : ($('always').checked ? '✓ متصل بخلفون: أسمع ندائك' : '✓ متصل بخلفون'), 'ok'); }
  catch { failures += 1; if (failures > 1) setState('✗ ما وصلت لخلفون. تأكد إن الجهازين على نفس الشبكة', 'bad'); }
}

/** Same as Khalfoun's own downsample (box average), so his ear hears the same thing. */
function downsample(input, from, to) {
  if (from === to) return input;
  const ratio = from / to; const out = new Float32Array(Math.floor(input.length / ratio));
  for (let i = 0; i < out.length; i += 1) { const s = Math.floor(i * ratio); const e = Math.min(input.length, Math.floor((i + 1) * ratio)); let sum = 0; for (let j = s; j < e; j += 1) sum += input[j]; out[i] = sum / Math.max(1, e - s); }
  return out;
}
function toPcm16(f) { const out = new Int16Array(f.length); for (let i = 0; i < f.length; i += 1) out[i] = Math.max(-1, Math.min(1, f[i])) * 32767; return out; }
function wav16(f) {
  const pcm = toPcm16(f); const buf = new ArrayBuffer(44 + pcm.length * 2); const v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i += 1) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + pcm.length * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, RATE, true); v.setUint32(28, RATE * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, pcm.length * 2, true);
  new Int16Array(buf, 44).set(pcm); return new Uint8Array(buf);
}

async function flush() {
  if (sending || !pendingLen) return;
  sending = true;
  const all = new Float32Array(pendingLen); let o = 0;
  for (const c of pending) { all.set(c, o); o += c.length; }
  pending = []; pendingLen = 0;
  try { await post('/audio', toPcm16(all).buffer, 'application/octet-stream'); lastOk = Date.now(); failures = 0; }
  catch { failures += 1; if (failures > 3) setState('✗ انقطع الاتصال بخلفون…', 'bad'); }
  sending = false;
}

function onSound(f) {
  let peak = 0; for (let i = 0; i < f.length; i += 1) peak = Math.max(peak, Math.abs(f[i]));
  $('meter').firstElementChild.style.width = `${Math.min(100, peak * 140)}%`;
  $('talk').style.setProperty('--lv', String(Math.min(1, peak * 2)));
  const s = downsample(f, ctx.sampleRate, RATE);
  if (talking) { talkBuf.push(s); talkLen += s.length; if (talkLen > RATE * 40) endTalk(); return; }
  if (!$('always').checked) return;
  pending.push(s); pendingLen += s.length;
  if (pendingLen > RATE * 2) { pending = pending.slice(-4); pendingLen = pending.reduce((n, c) => n + c.length, 0); } // fell behind
  if (pendingLen >= RATE * 0.2) flush();
}

async function start() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
  } catch (err) {
    setState(location.protocol !== 'https:' ? '✗ لازم الصفحة تنفتح من رمز QR' : '✗ ما سمحت بالمايك. اسمح له من إعدادات المتصفح', 'bad');
    return;
  }
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();
  src = ctx.createMediaStreamSource(stream);
  node = ctx.createScriptProcessor(4096, 1, 1);
  node.onaudioprocess = (e) => onSound(new Float32Array(e.inputBuffer.getChannelData(0)));
  src.connect(node); node.connect(ctx.destination);
  $('intro').hidden = true; $('main').hidden = false;
  keepAwake();
  hello();
  setInterval(hello, 2500);
  setInterval(inbox, 4000); inbox();
}

// The teacher's inbox: Khalfoun's quiet suggestions, gradings to approve, a quiz to show
let inboxSeen = '';
async function inbox() {
  if (document.hidden) return;
  try {
    const r = await post('/inbox', '');
    const j = await r.json();
    renderInbox(j.items || []);
  } catch { /* next time */ }
}
function renderInbox(items) {
  const key = JSON.stringify(items.map((i) => [i.id, i.status]));
  if (key === inboxSeen) return;
  const fresh = items.some((i) => !inboxSeen.includes(`"${i.id}"`) && i.status === 'new');
  inboxSeen = key;
  const list = $('inbox-list'); list.textContent = '';
  const open = items.filter((i) => i.status === 'new');
  $('inbox').hidden = !open.length;
  $('inbox-n').textContent = open.length ? `(${open.length.toLocaleString('ar-EG')})` : '';
  if (fresh) navigator.vibrate?.([30, 60, 30]);
  for (const it of open) {
    const card = document.createElement('div'); card.className = 'card';
    const h = document.createElement('b'); h.textContent = it.title; card.append(h);
    const p = document.createElement('p'); p.textContent = it.body || ''; card.append(p);
    const row = document.createElement('div'); row.className = 'row';
    for (const a of it.actions || []) {
      const b = document.createElement('button'); b.textContent = a.label; if (a.main) b.className = 'go';
      b.addEventListener('click', async () => { navigator.vibrate?.(15); try { const r = await post('/inbox/act', '', null, `&id=${encodeURIComponent(it.id)}&action=${encodeURIComponent(a.id)}`); renderInbox((await r.json()).items || []); } catch { setState('✗ ما وصل', 'bad'); } });
      row.append(b);
    }
    card.append(row); list.append(card);
  }
}

async function keepAwake() {
  try { lock = await navigator.wakeLock?.request('screen'); } catch { lock = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); ctx?.resume(); } });

function beginTalk(e) {
  e.preventDefault();
  if (!ctx || talking) return;
  talking = true; talkBuf = []; talkLen = 0;
  $('talk').classList.add('on');
  navigator.vibrate?.(30);
  setState('🔴 أسمعك… اترك الزر لما تخلص', 'ok');
}
async function endTalk() {
  if (!talking) return;
  talking = false;
  $('talk').classList.remove('on');
  const all = new Float32Array(talkLen); let o = 0;
  for (const c of talkBuf) { all.set(c, o); o += c.length; }
  talkBuf = []; talkLen = 0;
  if (all.length < RATE * 0.3) { setState('اضغط الزر وخلك ضاغط وأنت تتكلم', 'ok'); return; }
  setState('… أرسلت لخلفون', 'ok');
  try { await post('/say', wav16(all), 'audio/wav'); } catch { setState('✗ ما وصل الأمر لخلفون', 'bad'); }
}

// ---------------------------------------------------------------- tabs, buttons, whisper, photos
for (const t of document.querySelectorAll('[role="tab"]')) {
  t.addEventListener('click', () => {
    for (const x of document.querySelectorAll('[role="tab"]')) x.setAttribute('aria-selected', String(x === t));
    for (const p of document.querySelectorAll('[data-pane]')) p.hidden = p.dataset.pane !== t.dataset.tab;
  });
}
function showState(st) {
  if (!st) return;
  $('b-mute').classList.toggle('on', Boolean(st.muted));
  $('b-mute').textContent = st.muted ? '🔈 رجّع صوته' : '🔇 سكّت صوته';
  $('b-bubble').classList.toggle('on', Boolean(st.bubbleHidden));
  $('b-bubble').textContent = st.bubbleHidden ? '💬 رجّع الفقاعة' : '💬 خبّي الفقاعة';
  $('b-fx').textContent = st.fxOff ? '✨ رجّع المؤثرات' : '✨ وقّف المؤثرات';
  $('b-emergency').classList.toggle('on', Boolean(st.halted));
  $('b-emergency').textContent = st.halted ? '▶️ رجّع خلفون يشتغل' : '⛔ طوارئ: وقّف كل شي';
  $('stepinfo').textContent = st.steps ? `الخطوة ${st.step.toLocaleString('ar-EG')} من ${st.steps.toLocaleString('ar-EG')}` : '';
}
for (const b of document.querySelectorAll('[data-cmd]')) {
  b.addEventListener('click', async () => {
    navigator.vibrate?.(15);
    try { const r = await post(`/cmd`, '', null, `&name=${b.dataset.cmd}`); showState((await r.json()).state); } catch { setState('✗ ما وصل الأمر لخلفون', 'bad'); }
  });
}
$('whisper').addEventListener('submit', async (e) => {
  e.preventDefault();
  const t = $('wtext').value.trim();
  if (!t) return;
  try { await post('/whisper', t, 'text/plain;charset=utf-8'); $('wtext').value = ''; setState('✓ وصلت الهمسة', 'ok'); } catch { setState('✗ ما وصلت الهمسة', 'bad'); }
});
let purpose = null;
for (const b of document.querySelectorAll('[data-photo]')) b.addEventListener('click', () => { purpose = b.dataset.photo; $('shot').value = ''; $('shot').click(); });
/** The photo made smaller on the phone (a class photo stays sharp enough for far faces). */
async function shrink(file, max) {
  const img = await createImageBitmap(file, { imageOrientation: 'from-image' }).catch(() => null);
  if (!img) return file;
  const s = Math.min(1, max / Math.max(img.width, img.height));
  if (s === 1 && file.size < 4e6) return file;
  const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise((r) => c.toBlob((b) => r(b || file), 'image/jpeg', 0.88));
}
$('shot').addEventListener('change', async () => {
  const f = $('shot').files?.[0];
  if (!f || !purpose) return;
  $('camstate').textContent = '… أرسل الصورة لخلفون';
  try {
    const blob = await shrink(f, purpose === 'pick' ? 2600 : 2000);
    await post('/photo', blob, blob.type || 'image/jpeg', `&purpose=${purpose}`);
    $('camstate').textContent = { pick: '✓ خلفون يختار الحين', doc: '✓ طلعت على الشاشة', grade: '✓ خلفون يصحّح', key: '✓ حفظ نموذج الإجابة' }[purpose];
  } catch { $('camstate').textContent = '✗ ما وصلت الصورة. جرّب مرة ثانية.'; }
});

$('start').addEventListener('click', start);
const t = $('talk');
t.addEventListener('pointerdown', beginTalk);
t.addEventListener('pointerup', endTalk);
t.addEventListener('pointercancel', endTalk);
t.addEventListener('pointerleave', endTalk);
t.addEventListener('contextmenu', (e) => e.preventDefault());
$('always').addEventListener('change', () => { hello(); if (!$('always').checked) { pending = []; pendingLen = 0; } });
window.addEventListener('pagehide', () => { post('/bye', '').catch(() => {}); }); // best effort: Khalfoun also notices when the phone goes quiet
hello();
</script>
</body>
</html>
