<!doctype html>
<html><head><meta charset="utf-8"><title>icon</title>
<style>html,body{margin:0;background:transparent}#c{width:256px;height:256px}</style></head>
<body><div id="c"></div>
<script type="module">
import { createCharacter } from '../src/renderer/character.js';
import { ANIMATIONS } from '../src/renderer/animations.js';
const ch = createCharacter(document.getElementById('c'));
ch.el.setAttribute('viewBox', '-70 -250 140 140');
ch.setEmotion({ emotion: 'happy', intensity: 2, secondary: null });
for (let i = 0; i < 20; i += 1) ch.render(1 / 20, ANIMATIONS.calm.pose(0, 1));
document.body.dataset.ready = '1';
</script></body></html>
